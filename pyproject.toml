[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litscout-download"
version = "0.1.3"
description = "Local paper-list download queue for paired browsers and AI agents"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.29,<1", "pypdf>=6.1,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "httpx>=0.27,<1", "reportlab>=4,<5", "playwright>=1.50,<2", "cryptography>=43"]

[project.scripts]
litscout-download = "litscout_download.cli:main"

[tool.setuptools.packages.find]
include = ["litscout_download*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
